<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 32 616 616" width="1024" height="1024" role="img" font-family="Bahnschrift, 'DIN Next', 'Barlow Semi Condensed', 'Oswald', 'Segoe UI Semibold', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>OSF Settings mission patch</title>
<desc>A circular embroidered mission patch in the OSF family style. Sage-green merrowed border with EST MMXXVI curved across the top and NATIVE SETTINGS FRAMEWORK across the bottom, flanked by pale green stars. In the center, the bold wordmark OSF in brushed steel over SETTINGS in sage green with a green accent bar. Below it, the setting-stack emblem - a slider, the active slider with a ringed focus node, and an ON toggle inside instrument brackets, with one small star - over a dark Starfield planet limb, on near-black with a faint starfield.</desc>
<defs>
  <clipPath id="scene"><circle cx="340" cy="340" r="238"/></clipPath>
  <path id="topArc" d="M116.61 221.22 A253 253 0 0 1 563.39 221.22" fill="none"/>
  <path id="botArc" d="M111.03 483.08 A270 270 0 0 0 568.97 483.08" fill="none"/>
</defs>

<circle cx="340" cy="340" r="296" fill="#86ad5e"/>
<circle cx="340" cy="340" r="289" fill="none" stroke="#3e5a2a" stroke-width="3"/>
<circle cx="340" cy="340" r="283" fill="#0c1118"/>
<circle cx="340" cy="340" r="238" fill="#0a0d12"/>

<g clip-path="url(#scene)">
  <g fill="#e4efd9">
    <circle cx="168" cy="196" r="1.2" opacity="0.45"/><circle cx="200" cy="158" r="0.9" opacity="0.38"/>
    <circle cx="512" cy="168" r="1.1" opacity="0.45"/><circle cx="486" cy="206" r="0.9" opacity="0.4"/>
    <circle cx="150" cy="262" r="1" opacity="0.4"/><circle cx="540" cy="262" r="1.1" opacity="0.44"/>
    <circle cx="498" cy="402" r="0.9" opacity="0.36"/><circle cx="178" cy="372" r="0.9" opacity="0.36"/>
    <circle cx="158" cy="216" r="0.8" opacity="0.32"/><circle cx="524" cy="232" r="0.8" opacity="0.34"/>
  </g>
  <circle cx="340" cy="845" r="360" fill="#151c24"/>
  <circle cx="340" cy="845" r="360" fill="none" stroke="#6f9a4f" stroke-width="2.5" opacity="0.6"/>
  <circle cx="340" cy="845" r="347" fill="none" stroke="#c4e2a0" stroke-width="1" opacity="0.28"/>
</g>

<circle cx="340" cy="340" r="239" fill="none" stroke="#b9c0c9" stroke-opacity="0.2" stroke-width="1"/>
<g stroke="#b9c0c9" stroke-opacity="0.38" stroke-width="1.6" stroke-linecap="round">
  <line x1="340" y1="98" x2="340" y2="104" transform="rotate(45 340 340)"/>
  <line x1="340" y1="98" x2="340" y2="104" transform="rotate(135 340 340)"/>
  <line x1="340" y1="98" x2="340" y2="104" transform="rotate(225 340 340)"/>
  <line x1="340" y1="98" x2="340" y2="104" transform="rotate(315 340 340)"/>
</g>

<text font-size="15" letter-spacing="7" font-weight="600" text-anchor="middle" fill="#9aa3ad">
  <textPath href="#topArc" startOffset="50%">EST · MMXXVI</textPath>
</text>
<text font-size="15.5" letter-spacing="4" font-weight="500" text-anchor="middle" fill="#aeb6bf">
  <textPath href="#botArc" startOffset="50%">NATIVE SETTINGS FRAMEWORK</textPath>
</text>

<text x="340" y="252" text-anchor="middle" font-size="74" letter-spacing="16" font-weight="700" fill="#cdd3da">OSF</text>
<g stroke="#6f9a4f" stroke-width="2.4" stroke-linecap="round">
  <line x1="290" y1="270" x2="390" y2="270"/>
  <line x1="290" y1="266" x2="290" y2="274"/><line x1="390" y1="266" x2="390" y2="274"/>
</g>
<text x="340" y="298" text-anchor="middle" font-size="25" letter-spacing="11" font-weight="600" fill="#8cb866">SETTINGS</text>

<!-- setting-stack emblem, centred under the wordmark -->
<g transform="translate(181.28,241.28) scale(0.62)">

  <!-- instrument brackets (the settings panel) -->
  <g fill="none" stroke="#8cb866" stroke-width="4" stroke-opacity="0.34" stroke-linecap="square">
    <path d="M142 150 H124 V362 H142"/><path d="M370 150 H388 V362 H370"/>
  </g>

  <!-- focus rings (family motif: rings around the thing that matters) -->
  <g fill="none" stroke="#8cb866">
    <circle cx="256" cy="256" r="24" stroke-opacity="0.5" stroke-width="2.8"/>
    <circle cx="256" cy="256" r="40" stroke-opacity="0.28" stroke-width="2.3"/>
    <circle cx="256" cy="256" r="56" stroke-opacity="0.14" stroke-width="2"/>
  </g>

  <!-- row 1: slider at ~70% -->
  <line x1="160" y1="190" x2="352" y2="190" stroke="#8cb866" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="190" x2="300" y2="190" stroke="#8cb866" stroke-width="5" stroke-linecap="round"/>
  <path d="M300 180 L310 190 L300 200 L290 190 Z" fill="#b8d98f"/>

  <!-- row 2: the active setting, knob at dead centre -->
  <line x1="160" y1="256" x2="352" y2="256" stroke="#8cb866" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="256" x2="244" y2="256" stroke="#8cb866" stroke-width="5" stroke-linecap="round"/>
  <path d="M160 248 L168 256 L160 264 L152 256 Z" fill="#b8d98f"/>
  <circle cx="256" cy="256" r="12" fill="#0a0d12" stroke="#8cb866" stroke-width="5"/>
  <circle cx="256" cy="256" r="5" fill="#eef6e0"/>

  <!-- row 3: toggle, ON -->
  <line x1="160" y1="322" x2="276" y2="322" stroke="#8cb866" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
  <rect x="294" y="310" width="58" height="24" fill="#0a0d12" fill-opacity="0.88" stroke="#8cb866" stroke-width="4"/>
  <rect x="300" y="316" width="24" height="12" fill="#8cb866" fill-opacity="0.35"/>
  <path d="M338 313 L347 322 L338 331 L329 322 Z" fill="#b8d98f"/>
  <!-- the single asymmetry: one star -->
  <path d="M424 160 L430 174 L444 180 L430 186 L424 200 L418 186 L404 180 L418 174 Z" fill="#b8d98f"/>
</g>

<!-- flanking stars -->
<g fill="#b8d98f">
  <path d="M78 328 L81.1 336.9 L90 340 L81.1 343.1 L78 352 L74.9 343.1 L66 340 L74.9 336.9 Z"/>
  <path d="M602 328 L605.1 336.9 L614 340 L605.1 343.1 L602 352 L598.9 343.1 L590 340 L598.9 336.9 Z"/>
</g>
</svg>
